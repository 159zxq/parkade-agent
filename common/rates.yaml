# ============================================================================
# 费率单一事实源（single source of truth）
# ----------------------------------------------------------------------------
# ⚠️ 临时版本：本文件由成员B 按《开发方案》§6.1 与《接口契约》§4 代写，
#    用于让 mock_service 能独立跑通验收。
#    正式归属成员A（红线：common/ 由 A 维护）。A 交付真实版本后请整体替换本文件。
# 数值来源：开发方案.md §6.1「拟稿数据设定」
# ============================================================================

currency: CNY

# 计费单位（分钟）与免费时长（分钟）
unit_minutes: 30
free_minutes: 15

# 时段划分：07:00–22:00 标准价；22:00–07:00 夜间价
day_window:
  standard: { start: "07:00", end: "22:00" }
  night:    { start: "22:00", end: "07:00" }

# 区域与容量
areas:
  A: { name: "地面区",   total: 30 }
  B: { name: "地下一层", total: 60 }
  C: { name: "地下二层", total: 60 }

# 车型费率（元）。standard/night 均为「每个 30 分钟计费单位」的价格。
vehicle_types:
  小型车: { standard: 3.0, night: 1.5, daily_cap: 30.0, monthly: 300.0 }
  中型车: { standard: 5.0, night: 2.5, daily_cap: 45.0, monthly: 450.0 }
  大型车: { standard: 8.0, night: 4.0, daily_cap: 60.0, monthly: 600.0 }

# 预约规则
reservation:
  free: true
  keep_minutes: 30   # 保留至 reserve_time + 30 分钟
